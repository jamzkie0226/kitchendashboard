<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Kitchen Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: -apple-system, Helvetica, Arial, sans-serif;
      background: #111;
      color: #eee;
    }
    .container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: 10px;
      box-sizing: border-box;
    }
    .row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 15px;
    }
    .card {
      background: #1c1c1c;
      border-radius: 12px;
      padding: 25px;
      flex: 1;
      margin: 10px;
      box-sizing: border-box;
      min-height: 160px;
    }
    .title {
      font-size: 16px;
      color: #aaa;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* LOCAL CLOCK — HUGE */
    .time-local {
      font-size: 95px;
      font-weight: 700;
      margin-top: 10px;
      line-height: 1.0;
    }

    /* PH CLOCK — SMALLER */
    .time-ph {
      font-size: 55px;
      font-weight: 700;
      margin-top: 10px;
      line-height: 1.0;
    }

    .date {
      font-size: 16px;
      color: #ccc;
      margin-top: 8px;
    }
    .weather-main {
      font-size: 28px;
      margin-bottom: 6px;
    }
    .weather-detail {
      font-size: 16px;
      color: #ccc;
    }
  </style>
</head>
<body>
  <div class="container">

    <!-- Time row -->
    <div class="row">
      <div class="card">
        <div class="title">London Time</div>
        <div id="time-local" class="time-local">--:--</div>
        <div id="date-local" class="date"></div>
      </div>

      <div class="card">
        <div class="title">Philippines Time</div>
        <div id="time-ph" class="time-ph">--:--</div>
        <div id="date-ph" class="date"></div>
      </div>
    </div>

    <!-- Weather row -->
    <div class="row">
      <div class="card">
        <div class="title">Weather (London)</div>
        <div id="weather-main" class="weather-main">Loading...</div>
        <div id="weather-detail" class="weather-detail"></div>
      </div>
    </div>

  </div>

  <script>
    // --- 12-hour formatter with improved AM/PM ---
    function formatTime12(dateObj) {
      var h = dateObj.getHours();
      var m = dateObj.getMinutes();
      var s = dateObj.getSeconds();

      var ampm = h >= 12 ? "PM" : "AM";
      h = h % 12;
      if (h === 0) h = 12;

      if (m < 10) m = "0" + m;
      if (s < 10) s = "0" + s;

      // AM/PM larger and clearer
      return h + ":" + m + ":" + s + " <span style='font-size:32px; vertical-align:middle;'>" + ampm + "</span>";
    }

    // --- Time handling (London & Philippines) ---
    function updateTimes() {
      var now = new Date();

      // --- Local (London) ---
      var localTime = formatTime12(now);

      var localDate = now.toLocaleDateString([], {
        weekday: 'short',
        year: 'numeric',
        month: 'short',
        day: 'numeric'
      });

      document.getElementById('time-local').innerHTML = localTime;
      document.getElementById('date-local').innerHTML = localDate;

      // --- PH time (manual +7 hours offset) ---
      var phNow = new Date(now.getTime() + (7 * 60 * 60 * 1000));

      var phTime = formatTime12(phNow);

      var phDate = phNow.toLocaleDateString([], {
        weekday: 'short',
        year: 'numeric',
        month: 'short',
        day: 'numeric'
      });

      document.getElementById('time-ph').innerHTML = phTime;
      document.getElementById('date-ph').innerHTML = phDate;
    }

    setInterval(updateTimes, 1000);
    updateTimes();

    // --- Weather handling (Open-Meteo, no API key) ---
    var latitude = 51.5074;
    var longitude = -0.1278;

    function fetchWeather() {
      var url = "https://api.open-meteo.com/v1/forecast"
        + "?latitude=" + latitude
        + "&longitude=" + longitude
        + "&current_weather=true";

      var xhr = new XMLHttpRequest();
      xhr.open("GET", url, true);
      xhr.onreadystatechange = function () {
        if (xhr.readyState === 4) {
          if (xhr.status === 200) {
            try {
              var data = JSON.parse(xhr.responseText);
              if (data && data.current_weather) {
                var cw = data.current_weather;
                var temp = cw.temperature;
                var wind = cw.windspeed;
                var code = cw.weathercode;

                var description = weatherCodeToText(code);

                document.getElementById('weather-main').innerHTML =
                  temp + "°C, " + description;

                document.getElementById('weather-detail').innerHTML =
                  "Wind: " + wind + " km/h";
              } else {
                document.getElementById('weather-main').innerHTML = "No data";
                document.getElementById('weather-detail').innerHTML = "";
              }
            } catch (e) {
              document.getElementById('weather-main').innerHTML = "Error parsing";
              document.getElementById('weather-detail').innerHTML = "";
            }
          } else {
            document.getElementById('weather-main').innerHTML = "Weather unavailable";
            document.getElementById('weather-detail').innerHTML = "";
          }
        }
      };
      xhr.send();
    }

    function weatherCodeToText(code) {
      if (code === 0) return "Clear sky";
      if (code === 1 || code === 2) return "Partly cloudy";
      if (code === 3) return "Overcast";
      if (code === 45 || code === 48) return "Fog";
      if (code === 51 || code === 53 || code === 55) return "Drizzle";
      if (code === 61 || code === 63 || code === 65) return "Rain";
      if (code === 71 || code === 73 || code === 75) return "Snow";
      if (code === 80 || code === 81 || code === 82) return "Rain showers";
      if (code === 95) return "Thunderstorm";
      return "Unknown";
    }

    fetchWeather();
    setInterval(fetchWeather, 10 * 60 * 1000);
  </script>
</body>
</html>
