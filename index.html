<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>My Kitchen</title>
<style>
    body {
        font-family: Arial;
        background: #111;
        color: #fff;
        padding: 20px;
        text-align: center;
    }

    /* Full-width boxes */
    .full-box {
        background: #222;
        padding: 20px;
        margin: 15px auto;
        width: 90%;
        border-radius: 12px;
        font-size: 22px;
        box-shadow: 0 0 10px rgba(255,255,255,0.1);
    }

    /* Side-by-side layout */
    .row {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        margin-top: 20px;
    }

    .col {
        flex: 1;
        background: #222;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 0 10px rgba(255,255,255,0.1);
    }

    /* BIG CLOCKS */
    .clock-col {
        font-size: 70px;
    }

    .clock-label {
        font-size: 25px;
        opacity: 0.8;
    }

    button {
        padding: 10px 20px;
        font-size: 20px;
        margin: 10px;
        border-radius: 10px;
        background: #444;
        color: #fff;
        border: none;
    }

    button:hover {
        background: #666;
    }

    input {
        font-size: 20px;
        padding: 10px;
        width: 80%;
        background: #333;
        color: #fff;
        border: 1px solid #555;
        border-radius: 8px;
    }

    ul {
        list-style: none;
        padding-left: 0;
    }

    li {
        margin: 8px 0;
    }
</style>
</head>

<body>

<h1>MY KITCHEN</h1>

<!-- CLOCKS -->
<div class="row">
    <div class="col clock-col">
        <div class="clock-label">🇬🇧 LOCAL TIME</div>
        <div id="localTime">--:--:--</div>
    </div>

    <div class="col clock-col">
        <div class="clock-label">🇵🇭 PH TIME</div>
        <div id="phTime">--:--:--</div>
    </div>
</div>

<!-- WEATHER (full width) -->
<div class="full-box">
    🌤 HENDON WEATHER: <span id="weather">Loading weather...</span>
</div>

<!-- TIMER (full width) -->
<div class="full-box">
    ⏱ TIMER: <span id="timer">00:00</span><br><br>

    <button onclick="startCountdown(5)">5 min</button>
    <button onclick="startCountdown(10)">10 min</button>
    <button onclick="startCountdown(15)">15 min</button>
    <button onclick="startCountdown(20)">20 min</button>
    <button onclick="startCountdown(30)">30 min</button>

    <br><br>
    <button onclick="stopCountdown()">Stop</button>
    <button onclick="resetCountdown()">Reset</button>
</div>

<!-- REMINDER + SHOPPING LIST SIDE BY SIDE -->
<div class="row">

    <div class="col" style="font-size:22px;">
        🔔 REMINDER<br><br>
        <input id="reminderInput" placeholder="Add reminder">
        <button onclick="addReminder()">Add</button>
        <ul id="reminderList" style="text-align:left;font-size:20px;"></ul>
    </div>

    <div class="col" style="font-size:22px;">
        🛒 SHOPPING LIST<br><br>
        <input id="itemInput" placeholder="Add item">
        <button onclick="addItem()">Add</button>
        <ul id="list" style="text-align:left;font-size:20px;"></ul>
    </div>

</div>

<!-- CLOCK SCRIPT -->
<script>
function updateClocks() {
    var nowUK = new Date();
    var nowPH = new Date(nowUK.getTime() + (8 * 60 * 60 * 1000));

    document.getElementById("localTime").innerHTML =
        ("0" + nowUK.getHours()).slice(-2) + ":" +
        ("0" + nowUK.getMinutes()).slice(-2) + ":" +
        ("0" + nowUK.getSeconds()).slice(-2);

    document.getElementById("phTime").innerHTML =
        ("0" + nowPH.getHours()).slice(-2) + ":" +
        ("0" + nowPH.getMinutes()).slice(-2) + ":" +
        ("0" + nowPH.getSeconds()).slice(-2);
}

updateClocks();
setInterval(updateClocks, 1000);
</script>

<!-- WEATHER SCRIPT -->
<script>
function loadWeather() {
    var xhr = new XMLHttpRequest();
    var apiKey = "cabcc9785f93a7bd8989d48fec90988d";
    var lat = 51.5760;
    var lon = -0.2389;

    var url = "https://api.openweathermap.org/data/2.5/weather?lat=" 
              + lat + "&lon=" + lon + "&units=metric&appid=" + apiKey;

    xhr.onreadystatechange = function () {
        if (xhr.readyState === 4 && xhr.status === 200) {
            var data = JSON.parse(xhr.responseText);
            var temp = Math.round(data.main.temp);
            var desc = data.weather[0].description;

            document.getElementById("weather").innerHTML =
                temp + "°C — " + desc;
        }
    };

    xhr.open("GET", url, true);
    xhr.send();
}

loadWeather();
setInterval(loadWeather, 600000);
</script>

<!-- COUNTDOWN TIMER SCRIPT -->
<script>
var countdownSeconds = 0;
var countdownInterval = null;

function startCountdown(minutes) {
    stopCountdown();
    countdownSeconds = minutes * 60;
    updateCountdownDisplay();

    countdownInterval = setInterval(function () {
        countdownSeconds--;

        if (countdownSeconds <= 0) {
            countdownSeconds = 0;
            updateCountdownDisplay();
            clearInterval(countdownInterval);
            countdownInterval = null;
            alert("Time's up!");
            return;
        }

        updateCountdownDisplay();
    }, 1000);
}

function stopCountdown() {
    clearInterval(countdownInterval);
    countdownInterval = null;
}

function resetCountdown() {
    stopCountdown();
    countdownSeconds = 0;
    updateCountdownDisplay();
}

function updateCountdownDisplay() {
    var mins = Math.floor(countdownSeconds / 60);
    var secs = countdownSeconds % 60;

    document.getElementById("timer").innerHTML =
        ("0" + mins).slice(-2) + ":" + ("0" + secs).slice(-2);
}
</script>

<!-- REMINDER SCRIPT -->
<script>
function loadReminders() {
    var items = JSON.parse(localStorage.getItem("reminderList") || "[]");
    var html = "";
    for (var i = 0; i < items.length; i++) {
        html += "<li>" + items[i] +
                " <button onclick='removeReminder(" + i + ")'>❌</button></li>";
    }
    document.getElementById("reminderList").innerHTML = html;
}

function addReminder() {
    var item = document.getElementById("reminderInput").value;
    if (item.length > 0) {
        var items = JSON.parse(localStorage.getItem("reminderList") || "[]");
        items.push(item);
        localStorage.setItem("reminderList", JSON.stringify(items));
        document.getElementById("reminderInput").value = "";
        loadReminders();
    }
}

function removeReminder(index) {
    var items = JSON.parse(localStorage.getItem("reminderList") || "[]");
    items.splice(index, 1);
    localStorage.setItem("reminderList", JSON.stringify(items));
    loadReminders();
}

loadReminders();
</script>

<!-- SHOPPING LIST SCRIPT -->
<script>
function loadList() {
    var items = JSON.parse(localStorage.getItem("shoppingList") || "[]");
    var html = "";
    for (var i = 0; i < items.length; i++) {
        html += "<li>" + items[i] +
                " <button onclick='removeItem(" + i + ")'>❌</button></li>";
    }
    document.getElementById("list").innerHTML = html;
}

function addItem() {
    var item = document.getElementById("itemInput").value;
    if (item.length > 0) {
        var items = JSON.parse(localStorage.getItem("shoppingList") || "[]");
        items.push(item);
        localStorage.setItem("shoppingList", JSON.stringify(items));
        document.getElementById("itemInput").value = "";
        loadList();
    }
}

function removeItem(index) {
    var items = JSON.parse(localStorage.getItem("shoppingList") || "[]");
    items.splice(index, 1);
    localStorage.setItem("shoppingList", JSON.stringify(items));
    loadList();
}

loadList();
</script>

</body>
</html>
