<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>My Kitchen</title>
<style>
    body {
        font-family: Arial;
        background: #111;
        color: #fff;
        padding: 20px;
        text-align: center;
    }
    .box {
        background: #222;
        padding: 20px;
        margin: 15px auto;
        width: 90%;
        border-radius: 12px;
        font-size: 22px;
        box-shadow: 0 0 10px rgba(255,255,255,0.1);
    }
    button {
        padding: 10px 20px;
        font-size: 20px;
        margin: 10px;
        border-radius: 10px;
        background: #444;
        color: #fff;
        border: none;
    }
    button:hover {
        background: #666;
    }
    input {
        font-size: 20px;
        padding: 10px;
        width: 80%;
        background: #333;
        color: #fff;
        border: 1px solid #555;
        border-radius: 8px;
    }
    /* Side-by-side time columns */
    .time-row {
        display: flex;
        justify-content: space-between;
        gap: 10px;
    }
    .time-col {
        flex: 1;
        background: #222;
        padding: 20px;
        border-radius: 12px;
        font-size: 30px;
        box-shadow: 0 0 10px rgba(255,255,255,0.1);
    }
    .time-label {
        font-size: 20px;
        opacity: 0.8;
    }
</style>
</head>

<body>

<h1 style="color:#fff;">MY KITCHEN</h1>

<!-- SIDE-BY-SIDE CLOCKS -->
<div class="time-row">
    <div class="time-col">
        <div class="time-label">🇬🇧 LOCAL TIME</div>
        <div id="localTime">--:--:--</div>
    </div>

    <div class="time-col">
        <div class="time-label">🇵🇭 PH TIME</div>
        <div id="phTime">--:--:--</div>
    </div>
</div>

<br>

<div class="box">
    🌤 HENDON WEATHER: <span id="weather">Loading weather...</span>
</div>

<div class="box">
    📖 RECIPES (coming soon)
</div>

<div class="box">
    ⏱ TIMER: <span id="timer">00:00</span><br><br>

    <button onclick="startCountdown(5)">5 min</button>
    <button onclick="startCountdown(10)">10 min</button>
    <button onclick="startCountdown(15)">15 min</button>
    <button onclick="startCountdown(20)">20 min</button>
    <button onclick="startCountdown(30)">30 min</button>

    <br><br>
    <button onclick="stopCountdown()">Stop</button>
    <button onclick="resetCountdown()">Reset</button>
</div>

<div class="box">
    🛒 SHOPPING LIST<br><br>
    <input id="itemInput" placeholder="Add item">
    <button onclick="addItem()">Add</button>
    <ul id="list" style="text-align:left;font-size:20px;"></ul>
</div>

<!-- CLOCKS -->
<script>
function updateClocks() {
    var nowUK = new Date();
    var nowPH = new Date(nowUK.getTime() + (8 * 60 * 60 * 1000));

    document.getElementById("localTime").innerHTML =
        ("0" + nowUK.getHours()).slice(-2) + ":" +
        ("0" + nowUK.getMinutes()).slice(-2) + ":" +
        ("0" + nowUK.getSeconds()).slice(-2);

    document.getElementById("phTime").innerHTML =
        ("0" + nowPH.getHours()).slice(-2) + ":" +
        ("0" + nowPH.getMinutes()).slice(-2) + ":" +
        ("0" + nowPH.getSeconds()).slice(-2);
}

updateClocks();
setInterval(updateClocks, 1000);
</script>

<!-- WEATHER (OpenWeatherMap + old Safari compatible) -->
<script>
function loadWeather() {
    var xhr = new XMLHttpRequest();
    var apiKey = "cabcc9785f93a7bd8989d48fec90988d";  // <-- replace this
    var lat = 51.5760;  // Hendon
    var lon = -0.2389;

    var url = "https://api.openweathermap.org/data/2.5/weather?lat=" 
              + lat + "&lon=" + lon + "&units=metric&appid=" + apiKey;

    xhr.onreadystatechange = function () {
        if (xhr.readyState === 4 && xhr.status === 200) {
            var data = JSON.parse(xhr.responseText);
            var temp = Math.round(data.main.temp);
            var desc = data.weather[0].description;

            document.getElementById("weather").innerHTML =
                temp + "°C — " + desc;
        }
    };

    xhr.open("GET", url, true);
    xhr.send();
}

loadWeather();
setInterval(loadWeather, 600000);
</script>

<!-- COUNTDOWN TIMER -->
<script>
var countdownSeconds = 0;
var countdownInterval = null;

function startCountdown(minutes) {
    stopCountdown();
    countdownSeconds = minutes * 60;
    updateCountdownDisplay();

    countdownInterval = setInterval(function () {
        countdownSeconds--;

        if (countdownSeconds <= 0) {
            countdownSeconds = 0;
            updateCountdownDisplay();
            clearInterval(countdownInterval);
            countdownInterval = null;
            alert("Time's up!");
            return;
        }

        updateCountdownDisplay();
    }, 1000);
}

function stopCountdown() {
    clearInterval(countdownInterval);
    countdownInterval = null;
}

function resetCountdown() {
    stopCountdown();
    countdownSeconds = 0;
    updateCountdownDisplay();
}
