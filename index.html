<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>My Kitchen</title>
<style>
    body {
        font-family: Arial;
        background: #111;
        color: #fff;
        padding: 20px;
        text-align: center;
    }

    .row {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        margin-top: 20px;
        width: 90%;
        margin-left: auto;
        margin-right: auto;
    }

    .col {
        flex: 1;
        background: #222;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 0 10px rgba(255,255,255,0.1);
        font-size: 22px;
    }

    .clock-col {
        font-size: 55px;
    }

    .clock-label {
        font-size: 25px;
        opacity: 0.8;
    }

    .clock-day {
        font-size: 22px;
        opacity: 0.7;
        margin-top: 10px;
    }

    button {
        padding: 10px 20px;
        font-size: 20px;
        margin: 10px;
        border-radius: 10px;
        background: #444;
        color: #fff;
        border: none;
    }

    button:hover {
        background: #666;
    }

    input {
        font-size: 20px;
        padding: 10px;
        width: 80%;
        background: #333;
        color: #fff;
        border: 1px solid #555;
        border-radius: 8px;
    }

    ul {
        list-style: none;
        padding-left: 0;
    }

    li {
        margin: 8px 0;
    }
</style>
</head>

<body>

<h1>MY KITCHEN</h1>

<!-- CLOCKS -->
<div class="row">
    <div class="col clock-col">
        <div class="clock-label">🇬🇧 LOCAL TIME</div>
        <div id="localTime">--:--:--</div>
        <div id="localDay" class="clock-day">---</div>
    </div>

    <div class="col clock-col">
        <div class="clock-label">🇵🇭 PH TIME</div>
        <div id="phTime">--:--:--</div>
    </div>
</div>

<!-- WEATHER -->
<div class="row">
    <div class="col">
        🌤 HENDON WEATHER: <span id="weather">Loading weather...</span>
    </div>
</div>

<!-- REMINDER + TIMER -->
<div class="row">

    <div class="col">
        🔔 REMINDER<br><br>
        <input id="reminderInput" placeholder="Add reminder">
        <button onclick="addReminder()">Add</button>
        <ul id="reminderList" style="text-align:left;font-size:20px;"></ul>
    </div>

    <div class="col">
        ⏱ TIMER: <span id="timer">00:00</span><br><br>

        <button onclick="startCountdown(5)">5 min</button>
