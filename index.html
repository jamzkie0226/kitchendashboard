<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Kitchen Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: -apple-system, Helvetica, Arial, sans-serif;
      background: #111;
      color: #eee;
    }
    .container {
      display: -webkit-box;
      display: -ms-flexbox;
      display: flex;
      -webkit-box-orient: vertical;
      -webkit-box-direction: normal;
      -ms-flex-direction: column;
      flex-direction: column;
      height: 100vh;
      padding: 10px;
      box-sizing: border-box;
    }
    .row {
      display: -webkit-box;
      display: -ms-flexbox;
      display: flex;
      -webkit-box-pack: justify;
      -ms-flex-pack: justify;
      justify-content: space-between;
      margin-bottom: 15px;
    }
    .card {
      background: #1c1c1c;
      border-radius: 8px;
      padding: 10px;
      -webkit-box-flex: 1;
      -ms-flex: 1;
      flex: 1;
      margin: 5px;
      box-sizing: border-box;
    }
    .title {
      font-size: 14px;
      color: #aaa;
      margin-bottom: 5px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .time {
      font-size: 32px;
      font-weight: 600;
    }
    .date {
      font-size: 14px;
      color: #ccc;
      margin-top: 4px;
    }
    .weather-main {
      font-size: 24px;
      margin-bottom: 4px;
    }
    .weather-detail {
      font-size: 14px;
      color: #ccc;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Time row -->
    <div class="row">
      <div class="card">
        <div class="title">London Time</div>
        <div id="time-local" class="time">--:--</div>
        <div id="date-local" class="date"></div>
      </div>
      <div class="card">
        <div class="title">Philippines Time</div>
        <div id="time-ph" class="time">--:--</div>
        <div id="date-ph" class="date"></div>
      </div>
    </div>

    <!-- Weather row -->
    <div class="row">
      <div class="card">
        <div class="title">Weather (London)</div>
        <div id="weather-main" class="weather-main">Loading...</div>
        <div id="weather-detail" class="weather-detail"></div>
      </div>
    </div>
  </div>

  <script>
    // --- Time handling (London & Philippines) ---
    function updateTimes() {
      var now = new Date();

      // Local (London) – relies on device timezone
      var localOptions = {
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit'
      };
      var localDateOptions = {
        weekday: 'short',
        year: 'numeric',
        month: 'short',
        day: 'numeric'
      };

      var localTime = now.toLocaleTimeString([], localOptions);
      var localDate = now.toLocaleDateString([], localDateOptions);

      document.getElementById('time-local').innerHTML = localTime;
      document.getElementById('date-local').innerHTML = localDate;

      // Philippines time (Asia/Manila)
      // iOS 9 Safari supports IANA time zones in toLocaleString reasonably well.
      var phOptions = {
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
        timeZone: 'Asia/Manila'
      };
      var phDateOptions = {
        weekday: 'short',
        year: 'numeric',
        month: 'short',
        day: 'numeric',
        timeZone: 'Asia/Manila'
      };

      var phTime = now.toLocaleTimeString([], phOptions);
      var phDate = now.toLocaleDateString([], phDateOptions);

      document.getElementById('time-ph').innerHTML = phTime;
      document.getElementById('date-ph').innerHTML = phDate;
    }

    setInterval(updateTimes, 1000);
    updateTimes();

    // --- Weather handling (Open-Meteo, no API key) ---
    // Coordinates for London (you can change these if needed)
    var latitude = 51.5074;
    var longitude = -0.1278;

    function fetchWeather() {
      var url = "https://api.open-meteo.com/v1/forecast"
        + "?latitude=" + latitude
        + "&longitude=" + longitude
        + "&current_weather=true";

      // Use XMLHttpRequest for better compatibility with older Safari
      var xhr = new XMLHttpRequest();
      xhr.open("GET", url, true);
      xhr.onreadystatechange = function () {
        if (xhr.readyState === 4) {
          if (xhr.status === 200) {
            try {
              var data = JSON.parse(xhr.responseText);
              if (data && data.current_weather) {
                var cw = data.current_weather;
                var temp = cw.temperature; // °C
                var wind = cw.windspeed;   // km/h
                var code = cw.weathercode;

                var description = weatherCodeToText(code);

                document.getElementById('weather-main').innerHTML =
                  temp + "°C, " + description;

                document.getElementById('weather-detail').innerHTML =
                  "Wind: " + wind + " km/h";
              } else {
                document.getElementById('weather-main').innerHTML = "No data";
                document.getElementById('weather-detail').innerHTML = "";
              }
            } catch (e) {
              document.getElementById('weather-main').innerHTML = "Error parsing";
              document.getElementById('weather-detail').innerHTML = "";
            }
          } else {
            document.getElementById('weather-main').innerHTML = "Weather unavailable";
            document.getElementById('weather-detail').innerHTML = "";
          }
        }
      };
      xhr.send();
    }

    // Simple mapping of Open-Meteo weather codes to text
    function weatherCodeToText(code) {
      // Basic subset
      if (code === 0) return "Clear sky";
      if (code === 1 || code === 2) return "Partly cloudy";
      if (code === 3) return "Overcast";
      if (code === 45 || code === 48) return "Fog";
      if (code === 51 || code === 53 || code === 55) return "Drizzle";
      if (code === 61 || code === 63 || code === 65) return "Rain";
      if (code === 71 || code === 73 || code === 75) return "Snow";
      if (code === 80 || code === 81 || code === 82) return "Rain showers";
      if (code === 95) return "Thunderstorm";
      return "Unknown";
    }

    // Fetch on load and every 10 minutes
    fetchWeather();
    setInterval(fetchWeather, 10 * 60 * 1000);
  </script>
</body>
</html>
