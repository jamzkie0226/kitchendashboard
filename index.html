<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>My Kitchen</title>
<style>
    body {
        font-family: Arial;
        background: #111;
        color: #fff;
        padding: 20px;
        text-align: center;
    }

    .row {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        margin-top: 20px;
        width: 90%;
        margin-left: auto;
        margin-right: auto;
    }

    .col {
        flex: 1;
        background: #222;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 0 10px rgba(255,255,255,0.1);
        font-size: 22px;
    }

    .clock-col {
        font-size: 55px;
    }

    .clock-label {
        font-size: 25px;
        opacity: 0.8;
    }

    .clock-day {
        font-size: 22px;
        opacity: 0.7;
        margin-top: 10px;
    }
