<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>My Kitchen</title>
<style>
    body {
        font-family: Arial;
        background: #f5f5f5;
        padding: 20px;
        text-align: center;
    }
    .box {
        background: white;
        padding: 20px;
        margin: 15px auto;
        width: 90%;
        border-radius: 12px;
        font-size: 22px;
        box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    button {
        padding: 10px 20px;
        font-size: 20px;
        margin: 10px;
        border-radius: 10px;
    }
    input {
        font-size: 20px;
        padding: 10px;
        width: 80%;
    }
</style>
</head>

<body>

<h1>MY KITCHEN</h1>

<div class="box">
    🇬🇧 LOCAL TIME: <span id="localTime">--:--:--</span>
</div>

<div class="box">
    🇵🇭 PH TIME: <span id="phTime">--:--:--</span>
</div>

<div class="box">
    🌤 HENDON WEATHER: <span id="weather">Loading weather...</span>
</div>

<div class="box">
    📖 RECIPES (coming soon)
</div>

<div class="box">
    ⏱ TIMER: <span id="timer">00:00</span><br><br>

    <button onclick="startCountdown(5)">5 min</button>
    <button onclick="startCountdown(10)">10 min</button>
    <button onclick="startCountdown(15)">15 min</button>
    <button onclick="startCountdown(20)">20 min</button>
    <button onclick="startCountdown(30)">30 min</button>

    <br><br>
    <button onclick="stopCountdown()">Stop</button>
    <button onclick="resetCountdown()">Reset</button>
</div>

<div class="box">
    🛒 SHOPPING LIST<br><br>
    <input id="itemInput" placeholder="Add item">
    <button onclick="addItem()">Add</button>
    <ul id="list" style="text-align:left;font-size:20px;"></ul>
</div>

<!-- CLOCKS -->
<script>
function updateClocks() {
    var nowUK = new Date();
    var nowPH = new Date(nowUK.getTime() + (8 * 60 * 60 * 1000));

    document.getElementById("localTime").innerHTML =
        nowUK.getHours() + ":" +
        ("0" + nowUK.getMinutes()).slice(-2) + ":" +
        ("0" + nowUK.getSeconds()).slice(-2);

    document.getElementById("phTime").innerHTML =
        nowPH.getHours() + ":" +
        ("0" + nowPH.getMinutes()).slice(-2) + ":" +
        ("0" + nowPH.getSeconds()).slice(-2);
}

updateClocks();
setInterval(updateClocks, 1000);
</script>

<!-- WEATHER (OpenWeatherMap + old Safari compatible) -->
<script>
function loadWeather() {
    var xhr = new XMLHttpRequest();
    var apiKey = "cabcc9785f93a7bd8989d48fec90988d";  // <-- replace this
    var lat = 51.5760;  // Hendon
    var lon = -0.2389;

    var url = "https://api.openweathermap.org/data/2.5/weather?lat=" 
              + lat + "&lon=" + lon + "&units=metric&appid=" + apiKey;

    xhr.onreadystatechange = function () {
        if (xhr.readyState === 4 && xhr.status === 200) {
            var data = JSON.parse(xhr.responseText);
            var temp = Math.round(data.main.temp);
            var desc = data.weather[0].description;

            document.getElementById("weather").innerHTML =
                temp + "°C — " + desc;
        }
    };

    xhr.open("GET", url, true);
    xhr.send();
}

loadWeather();
setInterval(loadWeather, 600000);
</script>

<!-- COUNTDOWN TIMER -->
<script>
var countdownSeconds = 0;
var countdownInterval = null;

function startCountdown(minutes) {
    stopCountdown();
    countdownSeconds = minutes * 60;
    updateCountdownDisplay();

    countdownInterval = setInterval(function () {
        countdownSeconds--;

        if (countdownSeconds <= 0) {
            countdownSeconds = 0;
            updateCountdownDisplay();
            clearInterval(countdownInterval);
            countdownInterval = null;
            alert("Time's up!");
            return;
        }

        updateCountdownDisplay();
    }, 1000);
}

function stopCountdown() {
    clearInterval(countdownInterval);
    countdownInterval = null;
}

function resetCountdown() {
    stopCountdown();
    countdownSeconds = 0;
    updateCountdownDisplay();
}

function updateCountdownDisplay() {
    var mins = Math.floor(countdownSeconds / 60);
    var secs = countdownSeconds % 60;

    var display =
        ("0" + mins).slice(-2) + ":" +
        ("0" + secs).slice(-2);

    document.getElementById("timer").innerHTML = display;
}
</script>

<!-- SHOPPING LIST -->
<script>
function loadList() {
    var items = localStorage.getItem("shoppingList");
    if (items) {
        document.getElementById("list").innerHTML = items;
    }
}

function addItem() {
    var item = document.getElementById("itemInput").value;
    if (item.length > 0) {
        var current = localStorage.getItem("shoppingList") || "";
        var updated = current + "<li>" + item + "</li>";
        localStorage.setItem("shoppingList", updated);
        document.getElementById("list").innerHTML = updated;
        document.getElementById("itemInput").value = "";
    }
}

loadList();
</script>

</body>
</html>
