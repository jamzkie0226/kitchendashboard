<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>My Kitchen</title>
<style>
    body {
        font-family: Arial;
        background: #111;
        color: #fff;
        padding: 20px;
        text-align: center;
    }

    /* Full-width boxes */
    .full-box {
        background: #222;
        padding: 20px;
        margin: 15px auto;
        width: 90%;
        border-radius: 12px;
        font-size: 22px;
        box-shadow: 0 0 10px rgba(255,255,255,0.1);
    }

    /* Side-by-side layout */
    .row {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        margin-top: 20px;
    }

    .col {
        flex: 1;
        background: #222;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 0 10px rgba(255,255,255,0.1);
    }

    /* BIG CLOCKS */
    .clock-col {
        font-size: 55px;
    }

    .clock-label {
        font-size: 25px;
        opacity: 0.8;
    }

    .clock-day {
        font-size: 22px;
        opacity: 0.7;
        margin-top: 10px;
    }

    button {
        padding: 10px 20px;
        font-size: 20px;
        margin: 10px;
        border-radius: 10px;
        background: #444;
        color: #fff;
        border: none;
    }

    button:hover {
        background: #666;
    }

    input {
        font-size: 20px;
        padding: 10px;
        width: 80%;
        background: #333;
        color: #fff;
        border: 1px solid #555;
        border-radius: 8px;
    }

    ul {
        list-style: none;
        padding-left: 0;
    }

    li {
        margin: 8px 0;
    }
</style>
</head>

<body>

<h1>MY KITCHEN</h1>

<!-- CLOCKS -->
<div class="row">
    <div class="col clock-col">
        <div class="clock-label">🇬🇧 LOCAL TIME</div>
        <div id="localTime">--:--:--</div>
        <div id="localDay" class="clock-day">---</div>
    </div>

    <div class="col clock-col">
        <div class="clock-label">🇵🇭 PH TIME</div>
        <div id="phTime">--:--:--</div>
    </div>
</div>

<!-- WEATHER (full width) -->
<div class="full-box">
    🌤 HENDON WEATHER: <span id="weather">Loading weather...</span>
</div>

<!-- REMINDER + TIMER SIDE BY SIDE -->
<div class="row">

    <div class="col" style="font-size:22px;">
        🔔 REMINDER<br><br>
        <input id="reminderInput" placeholder="Add reminder">
        <button onclick="addReminder()">Add</button>
        <ul id="reminderList" style="text-align:left;font-size:20px;"></ul>
    </div>

    <div class="col" style="font-size:22px;">
        ⏱ TIMER: <span id="timer">00:00</span><br><br>

        <button onclick="startCountdown(5)">5 min</button>
        <button onclick="startCountdown(10)">10 min</button>
        <button onclick="startCountdown(15)">15 min</button>
        <button onclick="startCountdown(20)">20 min</button>
        <button onclick="startCountdown(30)">30 min</button>

        <br><br>
        <button onclick="stopCountdown()">Stop</button>
        <button onclick="resetCountdown()">Reset</button>
    </div>

</div>

<!-- TIMER SOUND -->
<audio id="alarmSound">
    <source src="https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg" type="audio/ogg">
</audio>

<!-- CLOCK SCRIPT -->
<script>
function formatAMPM(date) {
    var hours = date.getHours();
    var minutes = date.getMinutes();
    var seconds = date.getSeconds();
    var ampm = hours >= 12 ? "PM" : "AM";
    hours = hours % 12;
    if (hours === 0) hours = 12;

    return (
        ("0" + hours).slice(-2) + ":" +
        ("0" + minutes).slice(-2) + ":" +
        ("0" + seconds).slice(-2) + " " + ampm
    );
}

function updateClocks() {
    var nowUK = new Date();
    var nowPH = new Date(nowUK.getTime() + (8 * 60 * 60 * 1000));

    document.getElementById("localTime").innerHTML = formatAMPM(nowUK);
    document.getElementById("phTime").innerHTML = formatAMPM(nowPH);

    var days = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
    document.getElementById("localDay").innerHTML = days[nowUK.getDay()];
}

updateClocks();
setInterval(updateClocks, 1000);
</script>

<!-- WEATHER SCRIPT -->
<script>
function loadWeather() {
    var xhr = new XMLHttpRequest();
    var apiKey = "cabcc9785f93a7bd8989d48fec90988d";
    var lat = 51.5760;
    var lon = -0.2389;

    var url = "https://api.openweathermap.org/data/2.5/weather?lat=" 
              + lat + "&lon=" + lon + "&units=metric&appid=" + apiKey;

    xhr.onreadystatechange = function () {
        if (xhr.readyState === 4 && xhr.status === 200) {
            var data = JSON.parse(xhr.responseText);
            var temp = Math.round(data.main.temp);
            var desc = data.weather[0].description;

            document.getElementById("weather").innerHTML =
                temp + "°C — " + desc;
        }
    };

    xhr.open("GET", url, true
