<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>My Kitchen</title>
<style>
    body {
        font-family: Arial;
        background: #f5f5f5;
        padding: 20px;
        text-align: center;
    }
    .box {
        background: white;
        padding: 20px;
        margin: 15px auto;
        width: 90%;
        border-radius: 12px;
        font-size: 22px;
        box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    button {
        padding: 10px 20px;
        font-size: 20px;
        margin: 10px;
        border-radius: 10px;
    }
</style>
</head>

<body>

<h1>MY KITCHEN</h1>

<div class="box">
    🇬🇧 LOCAL TIME: <span id="localTime">--:--:--</span>
</div>

<div class="box">
    🇵🇭 PH TIME: <span id="phTime">--:--:--</span>
</div>

<div class="box">
    🌤 HENDON WEATHER: <span id="weather">Loading weather...</span>
</div>

<div class="box">
    📖 RECIPES (coming soon)
</div>

<div class="box">
    ⏱ TIMER: <span id="timer">0s</span><br><br>
    <button onclick="startTimer()">Start</button>
    <button onclick="stopTimer()">Stop</button>
    <button onclick="resetTimer()">Reset</button>
</div>

<div class="box">
    🛒 SHOPPING LIST<br><br>
    <input id="itemInput" placeholder="Add item" style="font-size:20px;padding:10px;width:80%;">
    <button onclick="addItem()">Add</button>
    <ul id="list" style="text-align:left;font-size:20px;"></ul>
</div>

<!-- CLOCKS -->
<script>
function updateClocks() {
    var nowUK = new Date();
    var nowPH = new Date(nowUK.getTime() + (8 * 60 * 60 * 1000));

    document.getElementById("localTime").innerHTML =
        nowUK.getHours() + ":" +
        ("0" + nowUK.getMinutes()).slice(-2) + ":" +
        ("0" + nowUK.getSeconds()).slice(-2);

    document.getElementById("phTime").innerHTML =
        nowPH.getHours() + ":" +
        ("0" + nowPH.getMinutes()).slice(-2) + ":" +
        ("0" + nowPH.getSeconds()).slice(-2);
}

updateClocks();
setInterval(updateClocks, 1000);
</script>

<!-- WEATHER (OpenWeatherMap + old Safari compatible) -->
<script>
function loadWeather() {
    var xhr = new XMLHttpRequest();
    var apiKey = "cabcc9785f93a7bd8989d48fec90988d";  // <-- replace this
    var lat = 51.5760;  // Hendon
    var lon = -0.2389;

    var url = "https://api.openweathermap.org/data/2.5/weather?lat=" 
              + lat + "&lon=" + lon + "&units=metric&appid=" + apiKey;

    xhr.onreadystatechange = function () {
        if (xhr.readyState === 4 && xhr.status === 200) {
            var data = JSON.parse(xhr.responseText);
            var temp = Math.round(data.main.temp);
            var desc = data.weather[0].description;

            document.getElementById("weather").innerHTML =
                temp + "°C — " + desc;
        }
    };

    xhr.open("GET", url, true);
    xhr.send();
}

loadWeather();
setInterval(loadWeather, 600000);
</script>

<!-- TIMER -->
<script>
var timerSeconds = 0;
var timerInterval = null;

function startTimer() {
    if (timerInterval === null) {
        timerInterval = setInterval(function () {
            timerSeconds++;
            document.getElementById("timer").innerHTML = timerSeconds + "s";
        }, 1000);
    }
}

function stopTimer() {
    clearInterval(timerInterval);
    timerInterval = null;
}

function resetTimer() {
    timerSeconds = 0;
    document.getElementById("timer").innerHTML = "0s";
}
</script>

<!-- SHOPPING LIST -->
<script>
function loadList() {
    var items = localStorage.getItem("shoppingList");
    if (items) {
        document.getElementById("list").innerHTML = items;
    }
}

function addItem() {
    var item = document.getElementById("itemInput").value;
    if (item.length > 0) {
        var current = localStorage.getItem("shoppingList") || "";
        var updated = current + "<li>" + item + "</li>";
        localStorage.setItem("shoppingList", updated);
        document.getElementById("list").innerHTML = updated;
        document.getElementById("itemInput").value = "";
    }
}

loadList();
</script>

</body>
</html>
